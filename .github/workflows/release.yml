name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.1)"
        required: true

jobs:
  npm:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Check tag matches package.json
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to publish unexpected tag: $TAG_NAME"; exit 1 ;;
          esac
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$PKG" ]; then
            echo "tag $TAG_NAME != package.json $PKG; bump the version first (npm version patch|minor|major)."
            exit 1
          fi

      - run: node --test

      # No NODE_AUTH_TOKEN: auth is the package's npm trusted publisher
      # (OIDC). Requires id-token: write (above) and a one-time setup on
      # npmjs.com linking this repo + workflow to the package.
      - run: npm publish --provenance --access public
